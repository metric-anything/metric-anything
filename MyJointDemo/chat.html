<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat - My Joint Demo</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #111;
      color: #eee;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    
    header {
      padding: 1rem;
      background: #1a1a1a;
      display: flex;
      align-items: center;
      gap: 1rem;
      border-bottom: 1px solid #333;
    }

    a { text-decoration: none; color: inherit; }

    .back-btn {
      padding: 0.5rem 1rem;
      background: #333;
      border-radius: 4px;
      font-weight: 500;
      transition: background 0.2s;
    }
    .back-btn:hover { background: #444; }

    h1 { margin: 0; font-size: 1.2rem; flex: 1; }

    .status {
      font-size: 0.8rem;
      color: #888;
      font-variant-numeric: tabular-nums;
      transition: color 0.3s;
    }
    .status.streaming { color: #f0a030; }
    .status.done { color: #4caf50; }
    .status.error { color: #ef5350; }

    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
    }

    .message {
      padding: 1rem;
      border-radius: 8px;
      max-width: 80%;
      line-height: 1.5;
      position: relative;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message.user {
      background: #0066cc;
      align-self: flex-end;
      color: white;
    }

    .message.assistant {
      background: #2a2a2a;
      align-self: flex-start;
      border: 1px solid #333;
    }

    .msg-stats {
      display: block;
      margin-top: 0.6rem;
      padding-top: 0.5rem;
      border-top: 1px solid #444;
      font-size: 0.7rem;
      color: #777;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    form {
      padding: 1rem;
      background: #1a1a1a;
      border-top: 1px solid #333;
      display: flex;
      gap: 0.5rem;
      justify-content: center;
    }

    .input-wrapper {
      display: flex;
      max-width: 800px;
      width: 100%;
      gap: 0.5rem;
    }

    input {
      flex: 1;
      padding: 0.8rem;
      border-radius: 4px;
      border: 1px solid #444;
      background: #111;
      color: #fff;
      font-size: 1rem;
    }
    
    input:focus { outline: 2px solid #0066cc; border-color: transparent; }

    button {
      padding: 0 1.5rem;
      background: #0066cc;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    button:hover { background: #0052a3; }
    button:disabled { background: #333; cursor: not-allowed; color: #888; }

    /* Markdown-ish styling for assistant responses */
    .message.assistant p { margin: 0 0 0.5em 0; }
    .message.assistant p:last-child { margin: 0; }
    .message.assistant code { background: #111; padding: 0.2em 0.4em; border-radius: 3px; font-family: monospace; }
    .message.assistant pre { background: #111; padding: 0.5em; border-radius: 4px; overflow-x: auto; }
  </style>
</head>
<body>
  <header>
    <a href="/" class="back-btn">← Back</a>
    <h1>Chat</h1>
    <div id="status-indicator" class="status">Ready</div>
  </header>

  <div id="chat-container"></div>

  <form id="chat-form">
    <div class="input-wrapper">
      <input type="text" id="prompt-input" placeholder="Type a message..." autocomplete="off" />
      <button type="submit" id="send-btn">Send</button>
    </div>
  </form>

  <script src="/config.js"></script>
  <script type="module" src="/src/chat.js"></script>
</body>
</html>
