services:
  depth-service:
    image: kinekernel/depth-service:latest
    ports:
      - "8081:8081"
    volumes:
      - ./weights:/app/weights:z
    environment:
      - DEPTH_WEIGHTS_DIR=/app/weights
      - DEPTH_DEVICE=cpu
      - DEPTH_DEFAULT_MODEL=metric-anything
      - CPU_THREADS=6
    restart: unless-stopped

  llm-service:
    image: ghcr.io/ggml-org/llama.cpp:server-vulkan
    ports:
      - "11434:8080"
    volumes:
      - ./weights/qwen2.5-1.5b:/models:z
    command: >
      -m /models/qwen2.5-1.5b-instruct-q4_k_m.gguf --host 0.0.0.0 --port 8080 -c 1024 -ngl 99
    # Expose GPU to the container (Vulkan)
    devices:
      - /dev/dri
    group_add:
      - "105" # render (verify with: getent group render)
      - "39" # video  (verify with: getent group video)
    restart: unless-stopped
    # Disable the image's built-in healthcheck (it lacks curl/wget)
    healthcheck:
      disable: true

  joint-demo:
    image: kinekernel/joint-demo:latest
    ports:
      - "3000:80"
    restart: unless-stopped
